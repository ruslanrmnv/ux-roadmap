  /* ---------- тренажёры ---------- */

  var SPRINT_POOL = [];
  Object.keys(LESSONS).forEach(function (k) {
    LESSONS[k].quiz.forEach(function (q) {
      SPRINT_POOL.push({ q: q.q, a: q.a, c: q.c, why: q.why, from: LESSONS[k].title });
    });
  });

  var game = null;

  function shuffled(n) {
    var arr = [];
    for (var i = 0; i < n; i++) arr.push(i);
    for (i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function sample(list, k) {
    return shuffled(list.length).slice(0, Math.min(k, list.length)).map(function (i) { return list[i]; });
  }
  function firstSentence(text) {
    var m = text.indexOf('. ');
    return m === -1 ? text : text.slice(0, m + 1);
  }

  function newGame(kind) {
    if (kind === 'cards') {
      return { kind: 'cards', queue: sample(GLOSSARY, 10), flipped: false, known: 0, total: 10, repeats: 0, over: false };
    }
    if (kind === 'pairs') {
      var pairs = sample(GLOSSARY, 5);
      return { kind: 'pairs', pairs: pairs, defOrder: shuffled(pairs.length), matched: {}, sel: -1, mistakes: 0, over: false };
    }
    if (kind === 'sprint') {
      return { kind: 'sprint', qs: sample(SPRINT_POOL, 10), i: 0, score: 0, answered: false, over: false };
    }
    return { kind: 'detective', qs: sample(HEURISTIC_CASES.map(function (h) { return { q: h.s, a: h.a, c: h.c, why: h.why }; }), 5), i: 0, score: 0, answered: false, over: false };
  }
  function openGame(kind) {
    game = newGame(kind);
    openOverlay(gameEl);
    renderGame();
  }
  function closeGame() {
    if (gameEl.hidden) return;
    game = null;
    gameBody.textContent = '';
    closeOverlayNode(gameEl);
  }
  function finishRound() {
    game.over = true;
    state.games.rounds++;
    if (game.kind === 'sprint' && game.score > state.games.sprintBest) state.games.sprintBest = game.score;
    bumpStreak();
    saveState();
    renderTopbar();
  }
  function gameProgress(part, total, label) {
    document.getElementById('gameBar').style.width = Math.round(part / total * 100) + '%';
    document.getElementById('gameCount').textContent = label;
  }
  function replayButtons(fin, again) {
    var row = el('div', 'fc-row');
    var more = el('button', 'l-next ghosty', again);
    more.type = 'button';
    more.dataset.gameReplay = '1';
    row.appendChild(more);
    var ok = el('button', 'l-next', 'Готово');
    ok.type = 'button';
    ok.dataset.gameFinish = '1';
    row.appendChild(ok);
    fin.appendChild(row);
    ok.focus();
  }

  function renderGame() {
    if (!game) return;
    gameBody.textContent = '';
    gameScroll.scrollTop = 0;

    if (game.over) {
      gameProgress(1, 1, '🎉');
      var fin = el('div', 'l-final');
      fin.appendChild(el('div', 'big', '🎉'));
      var fh = el('h2', '', game.kind === 'sprint' || game.kind === 'detective'
        ? game.score + ' из ' + game.qs.length
        : 'Раунд пройден');
      fh.id = 'gameTitle';
      fin.appendChild(fh);
      var sub;
      if (game.kind === 'cards') sub = game.repeats ? 'Все 10 терминов разобраны. Повторов понадобилось: ' + game.repeats + '.' : 'Все 10 терминов разобраны с первого захода. Сильно.';
      else if (game.kind === 'pairs') sub = game.mistakes ? 'Все пары собраны. Промахов: ' + game.mistakes + '.' : 'Все пары собраны без единого промаха.';
      else if (game.kind === 'sprint') sub = game.score === game.qs.length ? 'Идеальный спринт! Рекорд: ' + state.games.sprintBest + '/10.' : 'Рекорд: ' + state.games.sprintBest + '/10. Ошибки — это тоже повторение.';
      else sub = game.score === game.qs.length ? 'Все нарушения найдены. Нильсен бы гордился.' : 'Разборы ошибок — лучший учебник. Попробуй ещё раунд.';
      fin.appendChild(el('p', '', sub));
      replayButtons(fin, 'Ещё раунд');
      gameBody.appendChild(fin);
      return;
    }

    if (game.kind === 'cards') {
      gameProgress(game.known, game.total, game.known + ' / ' + game.total);
      var term = game.queue[0];
      gameBody.appendChild(el('div', 'l-eyebrow', '🃏 Карточки терминов'));
      var card = el('div', 'fc-card');
      card.appendChild(el('div', 'fc-kicker', game.flipped ? 'Определение' : 'Что это?'));
      var th = el('div', 'fc-term', term.t);
      th.id = 'gameTitle';
      card.appendChild(th);
      if (game.flipped) card.appendChild(el('p', 'fc-def', term.d));
      gameBody.appendChild(card);
      if (!game.flipped) {
        var flip = el('button', 'l-next', 'Показать определение');
        flip.type = 'button';
        flip.dataset.gameFlip = '1';
        gameBody.appendChild(flip);
        flip.focus();
      } else {
        var row = el('div', 'fc-row');
        var no = el('button', 'l-next ghosty', '🔁 Ещё раз');
        no.type = 'button';
        no.dataset.gameAgain = '1';
        row.appendChild(no);
        var yes = el('button', 'l-next', '👍 Знал');
        yes.type = 'button';
        yes.dataset.gameKnew = '1';
        row.appendChild(yes);
        gameBody.appendChild(row);
        yes.focus();
      }
      gameBody.appendChild(el('p', 'game-note', 'Вспомни своими словами, потом сверься. «Ещё раз» вернёт карточку в конец колоды.'));
      return;
    }

    if (game.kind === 'pairs') {
      var matchedN = Object.keys(game.matched).length;
      gameProgress(matchedN, game.pairs.length, matchedN + ' / ' + game.pairs.length);
      gameBody.appendChild(el('div', 'l-eyebrow', '🧩 Пары'));
      var gh = el('h2', 'quiz-q', 'Соедини термин с определением');
      gh.id = 'gameTitle';
      gameBody.appendChild(gh);
      /* подсказка ДО сетки — чтобы на маленьких экранах её было видно без прокрутки */
      gameBody.appendChild(el('p', 'game-note', game.sel === -1 ? 'Сначала выбери термин слева, потом его определение справа.' : 'Теперь найди определение справа.'));
      var grid = el('div', 'pairs');
      game.pairs.forEach(function (p, i) {
        var tbtn = el('button', 'pair-btn pt' + (game.matched[i] ? ' matched' : '') + (game.sel === i ? ' selected' : ''), p.t);
        tbtn.type = 'button';
        tbtn.dataset.pairTerm = i;
        tbtn.disabled = !!game.matched[i];
        grid.appendChild(tbtn);
        var di = game.defOrder[i];
        var dbtn = el('button', 'pair-btn' + (game.matched[di] ? ' matched' : ''), firstSentence(game.pairs[di].d));
        dbtn.type = 'button';
        dbtn.dataset.pairDef = di;
        dbtn.disabled = !!game.matched[di];
        grid.appendChild(dbtn);
      });
      gameBody.appendChild(grid);
      var pf = grid.querySelector(game.sel >= 0 ? '[data-pair-def]:not([disabled])' : '[data-pair-term]:not([disabled])');
      if (pf) pf.focus();
      return;
    }

    /* спринт и детектив — общий квиз */
    var q = game.qs[game.i];
    gameProgress(game.i + (game.answered ? 1 : 0), game.qs.length, (game.i + 1) + ' / ' + game.qs.length);
    gameBody.appendChild(el('div', 'l-eyebrow', game.kind === 'sprint' ? '⚡ Спринт · счёт ' + game.score : '🕵️ Детектив · какое правило нарушено?'));
    var qh = el('h2', 'quiz-q', q.q);
    qh.id = 'gameTitle';
    gameBody.appendChild(qh);
    var opts = el('ul', 'quiz-opts');
    q.a.forEach(function (optText, oi) {
      var li = el('li');
      var b = el('button', 'quiz-opt', optText);
      b.type = 'button';
      b.dataset.gameOpt = oi;
      li.appendChild(b);
      opts.appendChild(li);
    });
    gameBody.appendChild(opts);
    var fo = opts.querySelector('.quiz-opt');
    if (fo) fo.focus();
  }

  gameBody.addEventListener('click', function (e) {
    if (!game) return;
    if (e.target.closest('[data-game-flip]')) { game.flipped = true; renderGame(); return; }
    if (e.target.closest('[data-game-knew]')) {
      game.queue.shift();
      game.known++;
      game.flipped = false;
      if (!game.queue.length) finishRound();
      renderGame();
      return;
    }
    if (e.target.closest('[data-game-again]')) {
      game.queue.push(game.queue.shift());
      game.repeats++;
      game.flipped = false;
      renderGame();
      return;
    }
    var pt = e.target.closest('[data-pair-term]');
    if (pt) { game.sel = Number(pt.dataset.pairTerm); renderGame(); return; }
    var pd = e.target.closest('[data-pair-def]');
    if (pd) {
      if (game.sel === -1) return;
      var di = Number(pd.dataset.pairDef);
      if (di === game.sel) {
        game.matched[di] = true;
        game.sel = -1;
        if (Object.keys(game.matched).length === game.pairs.length) finishRound();
        renderGame();
      } else {
        game.mistakes++;
        var selBtn = gameBody.querySelector('[data-pair-term="' + game.sel + '"]');
        game.sel = -1;
        [pd, selBtn].forEach(function (b) {
          if (!b) return;
          b.classList.remove('selected');
          b.classList.add('miss');
          setTimeout(function () { b.classList.remove('miss'); }, 400);
        });
      }
      return;
    }
    var opt = e.target.closest('[data-game-opt]');
    if (opt && !game.answered) {
      game.answered = true;
      var q = game.qs[game.i];
      var chosen = Number(opt.dataset.gameOpt);
      if (chosen === q.c) game.score++;
      gameBody.querySelectorAll('.quiz-opt').forEach(function (b, bi) {
        b.disabled = true;
        if (bi === q.c) b.classList.add('right');
        else if (bi === chosen) b.classList.add('wrong');
      });
      var why = el('div', 'quiz-why');
      why.appendChild(el('b', '', chosen === q.c ? 'Верно. ' : 'Не совсем. '));
      why.appendChild(document.createTextNode(q.why));
      gameBody.appendChild(why);
      var next = el('button', 'l-next', game.i === game.qs.length - 1 ? 'Результат →' : 'Дальше');
      next.type = 'button';
      next.dataset.gameNext = '1';
      gameBody.appendChild(next);
      next.focus();
      return;
    }
    if (e.target.closest('[data-game-next]')) {
      game.i++;
      game.answered = false;
      if (game.i >= game.qs.length) finishRound();
      renderGame();
      return;
    }
    if (e.target.closest('[data-game-replay]')) {
      game = newGame(game.kind);
      renderGame();
      return;
    }
    if (e.target.closest('[data-game-finish]')) requestCloseOverlay();
  });

  /* ---------- celebration ---------- */

  var celebrateEl = document.getElementById('celebrate');
  var behind = [document.querySelector('.topbar'), document.querySelector('main'), document.querySelector('.tabbar')];
  function setBehindInert(on) {
    behind.forEach(function (n) {
      if (on) n.setAttribute('inert', '');
      else n.removeAttribute('inert');
    });
  }
  function showCelebration(si) {
    var allClosed = STAGES.every(function (_, i) { return stageClosed(i); });
    document.getElementById('celebrateTitle').textContent = allClosed ? 'Роадмап пройден!' : 'Этап закрыт!';
    document.getElementById('celebrateText').textContent = allClosed
      ? STAGES[si].title + ' — это был последний гейт. Дальше — работа.'
      : STAGES[si].title + ' позади. Гейт взят руками, как и положено.';
    document.getElementById('celebrateNext').textContent = allClosed ? 'Финиш' : 'Дальше';
    celebrateEl.hidden = false;
    setBehindInert(true);
    document.getElementById('celebrateNext').focus();
  }
  function hideCelebration() {
    celebrateEl.hidden = true;
    setBehindInert(false);
    renderActive();
    var tab = document.querySelector('.tab[aria-selected="true"]');
    if (tab) tab.focus();
  }

  /* ---------- events ---------- */

  document.querySelector('.tabbar').addEventListener('click', function (e) {
    var b = e.target.closest('.tab');
    if (b) switchTab(b.dataset.tab);
  });

  viewNow.addEventListener('click', function (e) {
    var lb = e.target.closest('[data-lesson]');
    if (lb) { openLesson(lb.dataset.lesson); return; }
    var vb = e.target.closest('[data-video]');
    if (vb) { openPlayer(vb.dataset.video); return; }
    var stepBtn = e.target.closest('[data-step]');
    if (stepBtn) {
      /* короткое «глухое» окно после автосмены карточки: второй тап по тому же
         месту не должен отмечать шаг ещё не прочитанной задачи */
      if (Date.now() < advanceGuardUntil) return;
      var id = stepBtn.dataset.step;
      var parts = id.match(/^s(\d+)-t(\d+)-p\d+$/);
      var si = Number(parts[1]), ti = Number(parts[2]);
      var wasDone = taskDone(si, ti);
      if (pendingAdvance) { clearTimeout(pendingAdvance); pendingAdvance = null; }
      justCompleted = '';
      if (state.steps[id]) {
        delete state.steps[id];
      } else {
        state.steps[id] = true;
        bumpStreak();
      }
      var nowDone = taskDone(si, ti);
      saveState();
      if (!wasDone && nowDone && STAGES[si].tasks[ti].gate) {
        if (state.focusTask === taskId(si, ti)) { state.focusTask = ''; saveState(); }
        renderTopbar();
        showCelebration(si);
        return;
      }
      if (!wasDone && nowDone) {
        justCompleted = taskId(si, ti);
        renderTopbar();
        renderNow();
        restoreStepFocus(id);
        pendingAdvance = setTimeout(function () {
          pendingAdvance = null;
          if (state.focusTask === justCompleted) { state.focusTask = ''; saveState(); }
          justCompleted = '';
          advanceGuardUntil = Date.now() + 350;
          renderActive();
          var nc = currentTask();
          document.getElementById('srLive').textContent = nc
            ? 'Задача закрыта. Следующая: ' + taskTitleText(STAGES[nc[0]].tasks[nc[1]])
            : 'Все задачи закрыты.';
        }, 1100);
        return;
      }
      renderActive();
      restoreStepFocus(id);
      return;
    }
    var back = e.target.closest('#backToCurrentBtn');
    if (back) {
      state.focusTask = '';
      saveState();
      renderNow();
      return;
    }
    var other = e.target.closest('#otherTaskBtn');
    if (other) {
      var cur = currentTask();
      if (cur) {
        var next = nextIncompleteAfter(taskId(cur[0], cur[1]));
        if (next) {
          state.focusTask = taskId(next[0], next[1]);
          saveState();
          renderNow();
        }
      }
    }
  });

  viewMap.addEventListener('click', function (e) {
    var f = e.target.closest('[data-filter]');
    if (f) { mapFilter = f.dataset.filter; renderMap(); return; }
    var sh = e.target.closest('[data-stage]');
    if (sh) {
      var si = Number(sh.dataset.stage);
      openStages[si] = !openStages[si];
      renderMap();
      return;
    }
    var row = e.target.closest('[data-task]');
    if (row && !e.target.closest('a')) {
      state.focusTask = row.dataset.task;
      saveState();
      switchTab('now');
    }
  });

  viewBase.addEventListener('click', function (e) {
    var lb = e.target.closest('[data-lesson]');
    if (lb) { openLesson(lb.dataset.lesson); return; }
    var vb = e.target.closest('[data-video]');
    if (vb) { openPlayer(vb.dataset.video); return; }
    var gb = e.target.closest('[data-game]');
    if (gb) { openGame(gb.dataset.game); return; }
    var tb = e.target.closest('[data-term]');
    if (tb) {
      var wrap = tb.parentElement;
      var open = wrap.classList.toggle('open');
      tb.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
  });

  viewMe.addEventListener('click', function (e) {
    if (e.target.closest('#remToggle')) {
      if (state.reminder.on) {
        state.reminder.on = false;
        remHint = '';
        saveState();
        renderMe();
      } else {
        enableReminder();
      }
      return;
    }
    if (e.target.closest('#remCal')) {
      downloadICS();
      return;
    }
    if (e.target.closest('#installBtn')) {
      var p = deferredInstall;
      if (!p) return;
      p.prompt();
      p.userChoice.then(function (choice) {
        if (choice && choice.outcome === 'accepted') {
          deferredInstall = null;
          installDone = true;
        }
        if (activeTab === 'me') renderMe();
      });
      return;
    }
    if (e.target.closest('#resetBtn')) {
      if (!confirm('Сбросить весь прогресс? Отменить это будет нельзя.')) return;
      if (pendingAdvance) { clearTimeout(pendingAdvance); pendingAdvance = null; }
      justCompleted = '';
      state = blankState();
      try { localStorage.removeItem(STORE_KEY); } catch (err) {}
      openStages = null;
      renderActive();
    }
  });

  viewMe.addEventListener('change', function (e) {
    if (e.target.id === 'remTime' && /^([01]\d|2[0-3]):[0-5]\d$/.test(e.target.value)) {
      state.reminder.time = e.target.value;
      saveState();
      renderMe();
    }
  });

  document.getElementById('celebrateNext').addEventListener('click', hideCelebration);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!celebrateEl.hidden) { hideCelebration(); return; }
    if (topOverlay()) requestCloseOverlay();
  });

  /* ---------- init ---------- */
  try {
    localStorage.setItem('uxRoadmap.test', '1');
    localStorage.removeItem('uxRoadmap.test');
  } catch (e) { markStorageBroken(); }
  if (state.focusTask) {
    var stale = findTask(state.focusTask);
    if (!stale || taskDone(stale[0], stale[1])) { state.focusTask = ''; saveState(); }
  }
  /* синхронизация инстансов: если сайт открыт одновременно во вкладке и в
     установленном приложении, изменения из другого окна подхватываются, а не
     затираются нашим старым снимком при следующем сохранении */
  function adoptExternalState() {
    if (!storageOk) return;
    state = loadState();
    if (topOverlay() === '' && celebrateEl.hidden) renderActive();
    else renderTopbar();
  }
  window.addEventListener('storage', function (e) {
    if (e.key === null || e.key === STORE_KEY) adoptExternalState();
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) adoptExternalState(); /* заодно после полуночи стрик в шапке пересчитается */
    checkReminder();
  });
  setInterval(checkReminder, 30000);
  checkReminder();
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
  switchTab('now');
})();
</script>
</body>
</html>
