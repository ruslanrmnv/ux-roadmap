<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F151E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UX-роадмап">
<title>UX: от нуля до найма</title>
<style>
:root{
  --bg:#0F151E;
  --surface:#161E29;
  --surface2:#1D2733;
  --border:#2A3644;
  --text:#EAF0F6;
  --muted:#8FA0B0;
  --accent:#FFD43D;
  --accent-ink:#201900;
  --accent-dim:rgba(255,212,61,.09);
  --mark:rgba(255,212,61,.16);
  --ring-track:#243040;
  --good:#7BD88F;
  --good-dim:rgba(123,216,143,.12);
  --bad:#F97583;
  --bad-dim:rgba(249,117,131,.12);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top); /* установленное приложение на iPhone: контент под статус-баром */
}
.topbar-in{
  max-width:560px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;gap:12px;
}
.brand{font-size:14px;font-weight:700;letter-spacing:.02em}
.topbar-spacer{flex:1}
.streak-pill{
  display:flex;align-items:center;gap:5px;
  font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--muted);
}
.streak-pill.on{color:var(--accent)}
.topring{display:flex;align-items:center;gap:7px}
.topring .pct{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- rings ---------- */
.ring{display:block}
.ring .track{stroke:var(--ring-track);fill:none}
.ring .val{stroke:var(--accent);fill:none;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .35s ease}

/* ---------- view: Сейчас ---------- */
.view{padding-top:20px}
.eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);
}
.focus-lede{margin:2px 0 14px;font-size:13.5px;color:var(--muted)}
.storage-warn{
  margin:14px 0 0;padding:10px 12px;
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  font-size:13px;line-height:1.45;color:var(--muted);
}
.focus-card{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-left:4px solid var(--accent);
  border-radius:16px;
  padding:18px 16px 16px;
}
.focus-card.is-done{border-left-color:var(--border)}
.focus-stage{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.focus-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{
  display:inline-flex;align-items:center;
  font-size:12.5px;font-weight:700;line-height:1;
  padding:6px 10px;border-radius:99px;
  background:var(--surface2);color:var(--muted);
}
.chip.gate{background:var(--accent);color:var(--accent-ink)}
.focus-title{
  margin-top:12px;
  font-size:22px;line-height:1.25;font-weight:800;letter-spacing:-.01em;
}
.gate-note{margin-top:6px;font-size:13px;color:var(--muted)}
.inline-link{color:var(--accent);text-underline-offset:3px}

.theory-btn{
  display:flex;align-items:center;gap:12px;
  width:100%;min-height:56px;margin-top:14px;padding:10px 12px;
  background:var(--accent-dim);
  border:1px solid var(--border);border-radius:12px;
  text-align:left;
}
.theory-btn .ico{flex:none;font-size:22px}
.theory-btn .tt{flex:1;min-width:0}
.theory-btn .kicker{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.theory-btn .name{display:block;font-size:15px;font-weight:700;line-height:1.3;margin-top:2px}
.theory-btn .go{flex:none;font-size:15px;font-weight:700;color:var(--accent)}
.theory-btn.done{background:var(--surface2)}
.theory-btn.done .go{color:var(--good)}

.steps{list-style:none;margin-top:16px}
.step{border-top:1px solid var(--border)}
.step-btn{
  display:flex;align-items:flex-start;gap:12px;
  width:100%;min-height:52px;padding:12px 6px;
  text-align:left;border-radius:8px;
}
.step-check{
  flex:none;width:26px;height:26px;margin-top:1px;
  border:2px solid #5A6B7D;border-radius:50%;
  display:inline-grid;place-content:center;
}
.step-check::after{
  content:"";width:11px;height:6px;
  border-left:2.5px solid var(--accent-ink);
  border-bottom:2.5px solid var(--accent-ink);
  transform:rotate(-45deg) translateY(-1px);
  opacity:0;
}
.step.done .step-check{background:var(--accent);border-color:var(--accent)}
.step.done .step-check::after{opacity:1}
.step-text{font-size:16px;padding-top:1px}
.step.done .step-text{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.step.now .step-text{
  background:var(--mark);
  border-radius:6px;
  padding:1px 6px;margin:0 -6px;
  box-decoration-break:clone;
  -webkit-box-decoration-break:clone;
}
@media (prefers-reduced-motion: no-preference){
  .step-check{transition:background .12s ease,border-color .12s ease}
  .step.done .step-check{animation:pop .16s ease}
  @keyframes pop{50%{transform:scale(1.18)}}
}

.links-label{margin-top:14px;font-size:12px;color:var(--muted)}
.task-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.link-chip{
  display:inline-flex;align-items:center;
  min-height:44px;padding:8px 16px;
  background:var(--surface2);
  border:1px solid var(--border);border-radius:99px;
  color:var(--accent);text-decoration:none;font-size:14px;font-weight:600;
}
.focus-actions{display:flex;justify-content:flex-end;align-items:center;min-height:44px;margin-top:14px}
.done-note{font-size:14px;font-weight:700;color:var(--accent)}
.ghost-btn{
  min-height:44px;padding:10px 14px;border-radius:10px;
  font-size:14px;font-weight:600;color:var(--muted);
}
.ghost-btn:active{background:var(--surface2)}
.all-done{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:32px 20px;text-align:center;
}
.all-done .big{font-size:40px}
.all-done h2{font-size:22px;font-weight:800;margin-top:10px}
.all-done p{color:var(--muted);margin-top:8px;font-size:15px}

/* ---------- view: Карта ---------- */
.map-head{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.map-head-text h1{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.map-sub{margin-top:6px;font-size:13.5px;color:var(--muted)}
.filters{display:flex;gap:8px;margin:16px 0}
.filter-btn{
  flex:1;min-height:44px;padding:8px 4px;
  font-size:14px;font-weight:600;white-space:nowrap;
  background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:10px;
}
@media (max-width:349px){
  .filter-btn{font-size:12.5px;padding:8px 2px}
}
.filter-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stage-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  margin-bottom:12px;
  overflow:hidden;
}
.stage-card.here{border-color:var(--accent)}
.stage-head{
  display:flex;align-items:center;gap:12px;
  width:100%;min-height:64px;padding:14px 16px;text-align:left;
}
.stage-head-text{flex:1;min-width:0}
.stage-eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stage-eyebrow .here-tag{color:var(--accent)}
.stage-name{font-size:16px;font-weight:700;line-height:1.3;margin-top:3px}
.stage-count{font-size:12.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.stage-ring{flex:none;position:relative;width:44px;height:44px}
.stage-ring .in{
  position:absolute;inset:0;display:grid;place-content:center;
  font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;
}
.stage-card.closed .stage-ring .in{color:var(--accent)}
.stage-body{border-top:1px solid var(--border);padding:4px 8px 10px}
.stage-card[data-open="false"] .stage-body{display:none}
.trow{
  display:flex;align-items:flex-start;gap:11px;
  width:100%;min-height:52px;padding:11px 8px;
  text-align:left;border-radius:10px;
}
.trow:active{background:var(--surface2)}
.trow-dot{
  flex:none;width:22px;height:22px;margin-top:1px;
  border:2px solid #5A6B7D;border-radius:50%;
  display:inline-grid;place-content:center;
}
.trow.done .trow-dot{background:var(--accent);border-color:var(--accent)}
.trow.done .trow-dot::after{
  content:"";width:9px;height:5px;
  border-left:2px solid var(--accent-ink);
  border-bottom:2px solid var(--accent-ink);
  transform:rotate(-45deg) translateY(-1px);
}
.trow-text{font-size:14.5px;line-height:1.4}
.trow.done .trow-text{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.trow-gate{
  display:inline-block;background:var(--accent);color:var(--accent-ink);
  font-size:11px;font-weight:700;line-height:1;
  padding:3px 7px;border-radius:5px;margin-right:6px;
  transform:translateY(-1px);
}

/* ---------- view: База ---------- */
.base-head h1{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.base-progress{display:flex;align-items:center;gap:12px;margin:14px 0 4px}
.base-progress .t{font-size:13.5px;color:var(--muted)}
.base-group{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  margin-top:12px;padding:6px 8px 8px;
}
.base-group h3{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.lrow{
  display:flex;align-items:center;gap:11px;
  width:100%;min-height:52px;padding:10px 8px;
  text-align:left;border-radius:10px;
}
.lrow:active{background:var(--surface2)}
.lrow .ico{flex:none;font-size:18px;width:24px;text-align:center}
.lrow .tt{flex:1;min-width:0}
.lrow .name{display:block;font-size:15px;line-height:1.35}
.lrow .mins{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.lrow .mark{flex:none;font-size:14px;font-weight:700;color:var(--good)}
.lrow.done .name{color:var(--muted)}
.term{border-top:1px solid var(--border)}
.term:first-of-type{border-top:0}
.term-btn{
  display:flex;align-items:center;gap:10px;
  width:100%;min-height:48px;padding:11px 8px;text-align:left;
}
.term-btn .w{flex:1;font-size:15px;font-weight:600}
.term-btn .chev{flex:none;color:var(--muted);font-size:13px;transition:none}
.term .def{display:none;padding:0 8px 14px;font-size:14.5px;line-height:1.55;color:var(--muted)}
.term.open .def{display:block}
.term.open .chev{color:var(--accent)}

/* ---------- view: Я ---------- */
.me-hero{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:20px 16px;text-align:center;
}
.me-streak{font-size:44px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.me-streak-label{color:var(--muted);font-size:13.5px;margin-top:2px}
.me-streak-note{color:var(--muted);font-size:13px;margin-top:8px}
.dots{display:flex;justify-content:center;gap:7px;margin-top:16px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ring-track)}
.dot.on{background:var(--accent)}
.dots-label{margin-top:8px;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:14px 8px;text-align:center;
}
.stat .n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);margin-top:3px}
.reset-row{margin-top:24px;text-align:center}
#resetBtn{
  min-height:48px;padding:12px 24px;
  font-size:15px;
  background:var(--surface);color:var(--muted);
  border:1px solid var(--border);border-radius:10px;
}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--surface);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-in{max-width:560px;margin:0 auto;display:flex}
.tab{
  flex:1;min-height:60px;padding:8px 2px 6px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11.5px;font-weight:600;color:var(--muted);
}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}

/* ---------- lesson player ---------- */
.lesson{
  position:fixed;inset:0;z-index:40;
  background:var(--bg);
  display:flex;flex-direction:column;
}
.lesson[hidden]{display:none}
.lesson-top{
  flex:none;display:flex;align-items:center;gap:12px;
  max-width:560px;width:100%;margin:0 auto;padding:10px 16px;
  padding-top:calc(10px + env(safe-area-inset-top));
  border-bottom:1px solid var(--border);
}
#lessonClose,#playerClose,#gameClose{
  flex:none;width:44px;height:44px;margin-left:-10px;
  display:grid;place-content:center;
  font-size:20px;color:var(--muted);border-radius:10px;
}
#lessonClose:active,#playerClose:active,#gameClose:active{background:var(--surface2)}
.overlay-kicker{flex:1;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lesson-track{flex:1;height:6px;border-radius:3px;background:var(--ring-track);overflow:hidden}
.lesson-bar{height:100%;width:0;background:var(--accent);border-radius:3px}
.lesson-count{flex:none;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.lesson-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lesson-body{padding-top:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.l-eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.l-h{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.25;margin-top:8px}
.l-p{margin-top:14px;font-size:17px;line-height:1.6}
.l-p.hint{font-size:14.5px;color:var(--muted)}
.l-next{
  display:block;width:100%;min-height:54px;margin-top:28px;padding:14px 20px;
  background:var(--accent);color:var(--accent-ink);
  border-radius:12px;font-size:16px;font-weight:700;
}
.quiz-q{font-size:20px;font-weight:800;line-height:1.3;margin-top:8px}
.quiz-opts{list-style:none;margin-top:18px}
.quiz-opt{
  display:block;width:100%;min-height:52px;margin-top:10px;padding:13px 14px;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  text-align:left;font-size:16px;line-height:1.4;
}
.quiz-opt.right{background:var(--good-dim);border-color:var(--good)}
.quiz-opt.wrong{background:var(--bad-dim);border-color:var(--bad)}
.quiz-opt:disabled{cursor:default}
.quiz-why{
  margin-top:16px;padding:12px 14px;
  background:var(--surface2);border-radius:12px;
  font-size:14.5px;line-height:1.55;color:var(--muted);
}
.quiz-why b{color:var(--text)}
.l-final{text-align:center;padding-top:32px}
.l-final .big{font-size:52px}
.l-final h2{font-size:24px;font-weight:800;margin-top:12px}
.l-final p{color:var(--muted);margin-top:8px;font-size:15px}
@media (prefers-reduced-motion: reduce){
  .lesson-bar,.ring .val{transition:none}
}
@media (prefers-reduced-motion: no-preference){
  .lesson-bar{transition:width .25s ease}
}

/* ---------- видео-плеер ---------- */
.theory-btn.video{background:var(--surface2)}
.theory-btn.video .ico{color:var(--accent);font-size:17px}
.video-box{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.video-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player-meta{margin-top:10px;font-size:13px;color:var(--muted)}
.player-title{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.3;margin-top:14px}
.player-note{
  margin-top:14px;padding:12px 14px;
  background:var(--surface2);border-radius:12px;
  font-size:14.5px;line-height:1.55;color:var(--muted);
}
.player-note b{color:var(--text)}
.player-ext{display:inline-flex;align-items:center;min-height:44px;margin-top:8px;color:var(--accent);font-size:14px;font-weight:600;text-underline-offset:3px}
.l-next.done-mark{background:var(--surface2);color:var(--good)}

/* ---------- тренажёры ---------- */
.fc-card{
  margin-top:20px;min-height:220px;
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:30px 18px;
  display:flex;flex-direction:column;justify-content:center;text-align:center;
}
.fc-kicker{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fc-term{font-size:25px;font-weight:800;letter-spacing:-.01em;line-height:1.25;margin-top:10px}
.fc-def{margin-top:14px;font-size:15.5px;line-height:1.55;color:var(--muted);text-align:left}
.fc-row{display:flex;gap:10px;margin-top:18px}
.fc-row .l-next{flex:1;margin-top:0}
.l-next.ghosty{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.pairs{display:grid;grid-template-columns:1fr 1.45fr;gap:8px;margin-top:18px}
.pair-btn{
  min-height:56px;padding:10px 11px;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  font-size:13.5px;line-height:1.35;text-align:left;
}
.pair-btn.pt{font-weight:700;font-size:14.5px}
.pair-btn.selected{border-color:var(--accent);background:var(--accent-dim)}
.pair-btn.matched{opacity:.4;border-color:var(--good)}
.pair-btn.miss{border-color:var(--bad)}
.game-note{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.5}
@media (prefers-reduced-motion: no-preference){
  .pair-btn.miss{animation:shake .3s ease}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
}

/* ---------- напоминания ---------- */
.me-card{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  margin-top:12px;padding:16px;
}
.me-card h3{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rem-row{display:flex;align-items:center;gap:12px;margin-top:12px}
.rem-text{flex:1;min-width:0;font-size:14.5px;line-height:1.4}
.rem-sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.rem-time{
  min-height:44px;padding:8px 12px;
  background:var(--surface2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;
  font:inherit;font-variant-numeric:tabular-nums;
}
.rem-btn{

<script>
(function () {

     БАЗА ЗНАНИЙ — свои уроки: теория карточками + проверь себя.

  var LESSONS = {

    /* ---------- Ресёрч ---------- */

    'ut-what': { title: 'Что такое юзабилити-тест', mins: 4,
      cards: [
        { h: 'Суть за 20 секунд', p: 'Юзабилити-тест — это когда живой человек пытается решить реальную задачу в интерфейсе, а ты молча смотришь, где он спотыкается.\nНе опрос. Не «как вам наш сайт?». Человек ДЕЛАЕТ, ты НАБЛЮДАЕШЬ.' },
        { h: 'Три роли', p: 'Респондент — человек, который выполняет задачу. Ему не нужно ничего знать про UX.\nМодератор — ты: даёшь задачу, молчишь, записываешь.\nИнтерфейс — сайт или приложение, которое проверяем. Важно: проверяем интерфейс, а не человека. Если человек запутался — виноват интерфейс.' },
        { h: 'Задача, а не экскурсия', p: 'Тест держится на конкретной задаче: «Забронируй столик на пятницу на двоих», а не «посмотри сайт и скажи, что думаешь».\nХорошая задача — с понятным финалом: заказ оформлен, форма отправлена, товар найден. Без финала нельзя увидеть, дошёл человек или застрял.' },
        { h: 'Думай вслух', p: 'Главный приём — think aloud: просишь респондента проговаривать мысли. «Ищу, где корзина… наверное, вот эта иконка… ой, нет».\nЭти слова — твои данные. Не «пользователю неудобно», а точная цитата: «я не понял, куда нажать, чтобы оплатить».' },
        { h: 'Главное', p: 'Тест = человек + интерфейс + одна конкретная задача.\nПроверяем интерфейс, а не человека.\nДанные — это точные слова и действия, а не мнения.\nУже 5 респондентов находят большинство серьёзных проблем — не нужны сотни.' }
      ],
      quiz: [
        { q: 'Что из этого — юзабилити-тест?', a: ['Спросить друга, нравится ли ему сайт доставки', 'Попросить друга заказать пиццу на этом сайте и молча смотреть', 'Показать другу 5 сайтов и спросить, какой красивее'], c: 1, why: 'Тест — это наблюдение за реальным действием. Мнения («нравится/красивее») почти ничего не говорят о том, сможет ли человек решить задачу.' },
        { q: 'Респондент запутался и не смог оформить заказ. Кто «виноват»?', a: ['Респондент — невнимательно читал', 'Интерфейс — он не провёл человека до цели', 'Модератор — плохо объяснил задачу'], c: 1, why: 'Базовый принцип: проверяем интерфейс, а не человека. Если запутался один — запутаются и другие.' }
      ] },

    'ut-watch': { title: 'Как смотреть чужие сессии', mins: 4,
      cards: [
        { h: 'Зачем смотреть чужое', p: 'Прежде чем вести тест самому, посмотри, как это делают другие: услышишь, какие вопросы задаёт модератор, и увидишь, как выглядит «застревание» со стороны.\nСмотри как разбор матча, а не как кино: с блокнотом и на паузах.' },
        { h: 'Сигналы застревания', p: 'Ищи в записи четыре сигнала:\n— пауза: курсор замер, человек молчит и сканирует экран;\n— метание: клики туда-обратно, возврат на предыдущий экран;\n— слова-маркеры: «хм», «а где…», «наверное, сюда?», «странно»;\n— обходной путь: человек добился цели, но не тем способом, который задуман.' },
        { h: 'Вопросы модератора', p: 'Обрати внимание: хороший модератор не помогает и не оправдывается. Его вопросы нейтральные: «Что вы сейчас ищете?», «Что вы ожидали увидеть?», «Продолжайте, как обычно».\nОн никогда не говорит «нажмите вон туда» и не спрашивает «правда, удобно?».' },
        { h: 'Главное', p: 'Смотри активно: жми паузу на каждом застревании и записывай, ЧТО случилось и ЧТО человек сказал в этот момент.\nКоллекционируй вопросы модератора — это твой будущий скрипт.' }
      ],
      quiz: [
        { q: 'Респондент замер и говорит «хм, а где тут вход в кабинет…». Что это?', a: ['Просто думает, это нормально', 'Сигнал: интерфейс не показывает очевидный путь', 'Ошибка записи'], c: 1, why: 'Пауза + слово-маркер = место, где интерфейс не справился. Именно такие моменты ты и выписываешь.' },
        { q: 'Какой вопрос — правильный для модератора?', a: ['«Что вы ожидали увидеть на этом экране?»', '«Удобный сайт, правда?»', '«Нажмите на жёлтую кнопку справа»'], c: 0, why: 'Нейтральный открытый вопрос не подсказывает и не давит. Похвалу выпрашивать и подсказывать нельзя — данные испортятся.' }
      ] },

    'facts': { title: 'Факты вместо мнений', mins: 3,
      cards: [
        { h: 'Две разные вещи', p: 'Наблюдение: «На шаге оплаты человек 40 секунд искал поле промокода и сказал: я думал, оно в корзине».\nОценка: «Оплата неудобная».\nПервое — факт, с ним можно работать. Второе — мнение, с ним спорят.' },
        { h: 'Формула находки', p: 'Сильная находка отвечает на три вопроса: ЧТО мешало + ГДЕ + ПОЧЕМУ (по словам или действиям человека).\n«Кнопка «Далее» на экране адреса не замечается (2 из 3 прокрутили мимо), потому что она серая и ниже границы экрана».' },
        { h: 'Точные слова', p: 'Записывай цитаты дословно, в кавычках, без пересказа. «Я не понял, это цена за всё или за месяц» — золото.\nПересказ «пользователь запутался в ценах» теряет главное: ГДЕ именно и КАК он запутался.' },
        { h: 'Главное', p: 'Проверяй каждую свою запись: это факт или оценка?\nОценки («неудобно», «непонятно», «плохой дизайн») вычёркивай или разворачивай в факт: что видел, что сказал, что сделал.' }
      ],
      quiz: [
        { q: 'Какая запись — рабочая находка?', a: ['«Регистрация бесит»', '«На форме регистрации 2 из 3 бросили на поле телефона: “зачем вам мой номер?”»', '«Форма в целом нормальная»'], c: 1, why: 'Есть что (бросают), где (поле телефона), почему (цитата про недоверие). По такой находке понятно, что чинить.' }
      ] },

    'ut-run': { title: 'Как провести тест самому', mins: 5,
      cards: [
        { h: 'Подготовка за 15 минут', p: 'Нужно всего три вещи:\n— человек: любой знакомый, кто не видел этот сайт;\n— сайт и одна задача с конкретным финалом;\n— способ фиксации: запись экрана или блокнот.\nСкажи честно: «Я учусь проводить тесты, мне нужно 15 минут. Проверяю сайт, а не тебя».' },
        { h: 'Скрипт старта', p: 'Начни одинаково с каждым: «Твоя задача — [задача]. Делай как обычно и, пожалуйста, думай вслух. Я не буду подсказывать — если совсем застрянешь, так и скажи. Ошибиться тут нельзя: если что-то не получится, это проблема сайта».' },
        { h: 'Золотое правило: молчи', p: 'Когда человек застрял, будет нестерпимо хотеться помочь. Нельзя. Подсказал — потерял самое ценное место теста.\nДержи паузу. Если молчание затянулось, задай нейтральный вопрос: «Что ты сейчас ищешь?» — и снова молчи.' },
        { h: 'Фиксация по горячим следам', p: 'Память врёт уже через час. Сразу после теста, за 5 минут, запиши:\n— 3 точные цитаты;\n— 3 наблюдения «что мешало и почему»;\n— место, где человек застрял дольше всего.\nЭто и есть результат теста.' },
        { h: 'Главное', p: 'Одна задача, честное вступление, молчание, точные слова, фиксация сразу.\nПервый тест будет неловким — это нормально и у всех так. Второй уже пойдёт легче.' }
      ],
      quiz: [
        { q: 'Респондент застрял и смотрит на тебя. Что делаешь?', a: ['Показываю, куда нажать, чтобы не мучился', 'Молчу; если пауза затянулась — «что ты сейчас ищешь?»', 'Говорю «тут все застревают, не переживай» и листаю дальше'], c: 1, why: 'Момент застревания — самая ценная часть теста. Подсказка стирает данные. Нейтральный вопрос помогает человеку говорить, не подсказывая.' },
        { q: 'Когда записывать выводы теста?', a: ['Вечером, когда будет время всё обдумать', 'Сразу после теста, за 5 минут', 'Через неделю, после всех тестов сразу'], c: 1, why: 'Через час детали и точные формулировки уже стёрты. Правило: фиксация — сразу, по горячим следам.' }
      ] },

    'interview': { title: 'Глубинное интервью', mins: 5,
      cards: [
        { h: 'Чем оно отличается от теста', p: 'Тест отвечает на вопрос «может ли человек это сделать». Интервью — «как человек живёт и решает эту проблему сейчас».\nИнтервью нужно ДО дизайна: понять контекст, боли и привычки, чтобы знать, что вообще проектировать.' },
        { h: 'Спрашивай про прошлое', p: 'Люди плохо предсказывают своё поведение и хорошо вспоминают конкретные случаи.\nПлохо: «Пользовались бы вы доставкой цветов?» (все вежливо скажут «да»).\nХорошо: «Расскажите, как вы в последний раз покупали цветы. С самого начала».' },
        { h: 'Открытые вопросы и «почему»', p: 'Задавай вопросы, на которые нельзя ответить «да/нет»: «как вы выбирали…», «что было дальше…», «что было самым раздражающим…».\nУслышал что-то интересное — копай: «почему?», «а что вы сделали потом?». Одна ветка «почему» часто ценнее десяти заготовленных вопросов.' },
        { h: 'Чего нельзя', p: 'Не подсказывай ответ вопросом: «ведь удобнее платить картой, да?» — это наводящий вопрос, данные испорчены.\nНе продавай свою идею и не защищай её. Ты пришёл слушать. Говорить должен респондент 80% времени.' },
        { h: 'Главное', p: 'План простой: 5–7 открытых вопросов про последний реальный случай + свободные «почему» по ходу.\nЗаписывай точные слова. После — сведи в 5–7 находок, как после теста.' }
      ],
      quiz: [
        { q: 'Какой вопрос даст честные данные?', a: ['«Вы бы стали пользоваться нашим приложением?»', '«Расскажите, как вы в последний раз заказывали еду домой»', '«Согласны, что наш фильтр удобнее, чем у конкурентов?»'], c: 1, why: 'Вопрос про реальный прошлый случай вытаскивает факты. Вопросы про будущее и наводящие вопросы дают вежливую фантазию.' },
        { q: 'Респондент сказал: «Я всегда сначала смотрю отзывы». Твой ход?', a: ['Отметить и перейти к следующему вопросу по списку', 'Спросить: «Почему? Расскажите, как это было в последний раз»', 'Рассказать, что в твоём прототипе отзывы будут на главной'], c: 1, why: 'За каждой привычкой стоит причина — она и есть инсайт. Копай «почему», а не беги по списку и не продавай своё решение.' }
      ] },

    'report': { title: 'Отчёт на одну страницу', mins: 4,
      cards: [
        { h: 'Зачем отчёт', p: 'Исследование без отчёта исчезает: через неделю ты сам не вспомнишь половину. Отчёт превращает «я потестил» в артефакт, который можно показать заказчику, команде — и положить в кейс.\nОдна страница. Больше никто не читает.' },
        { h: 'Скелет из четырёх блоков', p: '1. Цель: что проверяли и на ком («3 респондента, задача — оформить заказ»).\n2. Как проходило: 2–3 строки о методе.\n3. Находки: 3–5 штук, каждая = что мешало + где + почему + цитата.\n4. Рекомендации: что сделать с каждой находкой.' },
        { h: 'Находки — по силе удара', p: 'Сортируй находки по серьёзности, а не по порядку экранов: сначала то, из-за чего люди НЕ ДОХОДЯТ до цели, потом то, что просто раздражает.\nК каждой находке — рекомендация в одну строку: «поднять кнопку выше сгиба», «переименовать раздел».' },
        { h: 'Главное', p: 'Цель → метод → находки с цитатами → рекомендации. Одна страница.\nПиши так, чтобы человек, который не был на тестах, за 2 минуты понял, что чинить в первую очередь.' }
      ],
      quiz: [
        { q: 'Что обязательно должно быть в отчёте?', a: ['Скриншоты всех экранов сайта', 'Находки с цитатами и рекомендации по каждой', 'Подробная стенограмма всех сессий'], c: 1, why: 'Ядро отчёта — находки (с доказательством-цитатой) и что с ними делать. Стенограммы и все скриншоты — сырьё, а не отчёт.' }
      ] },

    /* ---------- Figma ---------- */

    'figma-ui': { title: 'Интерфейс Figma: главное', mins: 4,
      cards: [
        { h: 'Не учи всё', p: 'В Figma сотни функций, для старта нужно 10%: фреймы, фигуры, текст, цвет и панель слоёв. Остальное подтянется по ходу задач.\nFigma бесплатна для личных файлов и работает прямо в браузере.' },
        { h: 'Фрейм — твой экран', p: 'Фрейм (клавиша F) — это «холст» экрана: выбери справа пресет iPhone, и получишь рамку нужного размера.\nВся работа живёт внутри фреймов. Один экран = один фрейм. Рядом на бесконечном поле — сколько угодно экранов.' },
        { h: 'Четыре инструмента', p: 'R — прямоугольник: кнопки, карточки, подложки.\nT — текст.\nO — круг, аватарки и иконки-заглушки.\nV — стрелка, чтобы выделять и двигать.\nЭтого хватает, чтобы собрать почти любой экран.' },
        { h: 'Слои и выравнивание', p: 'Слева — панель слоёв: из чего собран экран, что поверх чего. Называй слои по-человечески: «кнопка», а не «Rectangle 47».\nСправа — свойства: точные размеры, цвет, а сверху кнопки выравнивания. Выравнивай кнопками, а не на глаз.' },
        { h: 'Главное', p: 'F — фрейм-экран, R/T/O — фигуры и текст, V — выделение. Слева слои, справа свойства.\nДальше учимся единственным работающим способом — повторяя реальные экраны руками.' }
      ],
      quiz: [
        { q: 'С чего начинается новый экран в Figma?', a: ['С прямоугольника на весь холст', 'С фрейма нужного размера (клавиша F)', 'С импорта картинки'], c: 1, why: 'Фрейм — это и есть экран: у него правильный размер устройства, внутри него живут все элементы.' }
      ] },

    'figma-tools': { title: 'Текст, цвет, отступы', mins: 4,
      cards: [
        { h: 'Текст под контролем', p: 'У текста три главных настройки: размер, насыщенность (regular/medium/bold) и межстрочный интервал.\nДля мобильных экранов: основной текст 15–17, подписи 12–13, заголовки 20–28. Межстрочный — примерно 1.4–1.5 от размера.' },
        { h: 'Цвет: меньше — лучше', p: 'Рабочая формула экрана: фон + цвет текста + один акцентный цвет для главных действий + серый для второстепенного.\nПипетка (I) снимает цвет с любого места — так ты будешь попадать в цвета оригинала при копировании.' },
        { h: 'Отступы решают', p: 'Разница между «съехавшим» и аккуратным макетом — почти всегда отступы. Держи кратность 4 или 8: отступы 8, 12, 16, 24, 32.\nЗажми Alt (Option) и наведи на соседний элемент — Figma покажет расстояние в пикселях. Проверяй, не верь глазам.' },
        { h: 'Главное', p: 'Текст: 2–3 размера и 2 насыщенности на экран.\nЦвет: фон + текст + один акцент.\nОтступы: кратны 8, проверяй через Alt.\nЭти три привычки дают 80% «аккуратности».' }
      ],
      quiz: [
        { q: 'Макет выглядит неряшливо. Что проверить первым делом?', a: ['Не добавить ли теней и градиентов', 'Одинаковы ли отступы и кратны ли они 8', 'Не сменить ли шрифт на более модный'], c: 1, why: 'Неровные и случайные отступы — причина «грязи» номер один. Выравнивание и кратные отступы чинят вид без единого нового эффекта.' }
      ] },

    'figma-copy': { title: 'Копия один в один: метод', mins: 4,
      cards: [
        { h: 'Почему копирование работает', p: 'Копируя хороший экран пиксель в пиксель, ты насмотренно «прошиваешь» в руки чужие правильные решения: размеры, отступы, иерархию.\nЭто самый быстрый способ научиться — как гаммы у музыкантов. Придумывать своё будешь позже.' },
        { h: 'Постановка', p: 'Сделай скриншот экрана приложения, которым сам пользуешься. Вставь его в Figma, рядом поставь пустой фрейм того же размера.\nРаботай «глядя на образец»: скриншот слева, твоя копия справа.' },
        { h: 'Порядок сборки', p: 'Иди сверху вниз крупными блоками: шапка → контент → нижняя навигация.\nСначала «коробки» — серые прямоугольники на месте блоков. Потом текст. Потом цвета пипеткой со скриншота. Детали и иконки — в конце.' },
        { h: 'Сверка', p: 'Финальный шаг: наложи свою копию поверх скриншота с прозрачностью 50% — расхождения вылезут сразу.\nДобивай отличия: размер шрифта, отступы, скругления. «Почти похоже» — это ещё не готово; смысл упражнения именно в точности.' }
      ],
      quiz: [
        { q: 'В чём смысл копирования экранов один в один?', a: ['Собрать портфолио из копий', 'Натренировать глаз и руки на правильных решениях', 'Проверить, честные ли дизайнеры у конкурентов'], c: 1, why: 'Копия — тренажёр: ты присваиваешь себе чужие выверенные размеры, отступы и иерархию. В портфолио копии не идут.' }
      ] },

    'ui-patterns': { title: 'Формы, списки, карточки', mins: 4,
      cards: [
        { h: 'Три кита экранов', p: 'Почти любой экран собран из трёх паттернов: форма (ввод данных), список (лента однотипных строк) и карточки (витрина блоков).\nНаучись собирать эти три — и сможешь собрать почти всё.' },
        { h: 'Анатомия формы', p: 'Поле ввода = подпись сверху + рамка поля + текст-подсказка внутри.\nПравила: одна колонка (не две!), подписи над полями, главная кнопка внизу на всю ширину, ошибки — текстом под полем, а не всплывашкой.' },
        { h: 'Анатомия списка и карточки', p: 'Строка списка: иконка/картинка слева, текст в 1–2 строки, действие или стрелка справа, разделитель между строками.\nКарточка: картинка сверху, заголовок, подпись серым, цена или кнопка. Все карточки в сетке — строго одной высоты и ширины.' },
        { h: 'Главное', p: 'Когда копируешь экран, называй про себя паттерны: «это форма», «это список».\nТак ты запоминаешь не конкретный экран, а конструктор, из которого потом соберёшь свои.' }
      ],
      quiz: [
        { q: 'Как правильно строить форму на мобильном экране?', a: ['Поля в две колонки, чтобы всё влезло без прокрутки', 'Одна колонка, подписи над полями, кнопка внизу во всю ширину', 'Подписи внутри полей, кнопка в правом верхнем углу'], c: 1, why: 'Одна колонка читается сверху вниз без зигзагов. Подпись над полем не исчезает при вводе. Широкая кнопка внизу — под большой палец.' }
      ] },

    'autolayout': { title: 'Auto-layout и компоненты', mins: 5,
      cards: [
        { h: 'Зачем это всё', p: 'Без auto-layout макет — как вёрстка из бумаги: изменил текст — всё поехало, двигай руками.\nС auto-layout блоки сами тянутся под контент и держат отступы. Это главный инструмент Figma и первое, о чём спрашивают на собеседованиях по макетам.' },
        { h: 'Как это работает', p: 'Выдели элементы и нажми Shift+A — они соберутся в auto-layout-контейнер.\nУ контейнера три настройки: направление (в строку или в столбец), отступ между элементами и внутренние поля. Кнопка = текст + поля 12 и 24 по бокам: текст длиннее — кнопка сама шире.' },
        { h: 'Компонент — источник правды', p: 'Компонент (Ctrl/Cmd+Alt+K) — эталон элемента. Его копии называются инстансами.\nПоменял эталон — поменялись все инстансы разом. Кнопка встречается на 10 экранах? Меняешь один раз, а не десять.' },
        { h: 'Проверка на прочность', p: 'Твой экран собран правильно, если проходит тест: удлини любой текст вдвое — ничего не наехало друг на друга; растяни фрейм по ширине — блоки растянулись сами.\nЕсли что-то сломалось — этот блок ещё не на auto-layout.' },
        { h: 'Главное', p: 'Shift+A — обернуть в auto-layout. Направление, отступ, поля — три настройки.\nПовторяющийся элемент — сразу компонент.\nТест готовности: длинный текст и растяжение ничего не ломают.' }
      ],
      quiz: [
        { q: 'Ты изменил текст кнопки, и она сама стала шире, сохранив поля. Почему?', a: ['Кнопка собрана на auto-layout', 'Повезло', 'Figma всегда так делает с любыми фигурами'], c: 0, why: 'Именно это и делает auto-layout: держит внутренние поля и подстраивает размер под контент. Обычный прямоугольник с текстом сверху так не умеет.' },
        { q: 'Кнопка используется на 10 экранах, нужно скруглить углы. Как правильно?', a: ['Поправить все 10 руками, это надёжнее', 'Поправить компонент-эталон — инстансы обновятся сами', 'Создать новую кнопку и заменить на трёх главных экранах'], c: 1, why: 'Для этого компоненты и существуют: один источник правды, правка в одном месте меняет всё. Ручные правки по экранам — путь к расхождениям.' }
      ] },

    /* ---------- Дизайн и принципы ---------- */

    'visual': { title: 'Типографика, отступы, иерархия', mins: 5,
      cards: [
        { h: 'Иерархия — это порядок чтения', p: 'Хороший экран сам ведёт взгляд: сначала главное, потом детали. Плохой — «всё кричит одинаково».\nИнструменты иерархии всего три: размер, насыщенность, цвет. Заголовок — крупнее и жирнее. Второстепенное — меньше и серым.' },
        { h: 'Типографика без боли', p: 'Один шрифт на весь продукт. 2–3 размера текста на экран, не больше.\nНе делай текст меньше 12 — не прочитают. Основной текст 15–17 с межстрочным ~1.5. Длина строки — до 60–70 символов.' },
        { h: 'Отступы — это грамматика', p: 'Правило близости: связанное — рядом, разное — дальше. Отступ между заголовком и его текстом должен быть МЕНЬШЕ, чем между разными блоками.\nДержи шкалу 8/12/16/24/32 и не изобретай «17 пикселей».' },
        { h: 'Контраст и цвет', p: 'Текст должен читаться: тёмное на светлом или светлое на тёмном, без «серого по серому».\nОдин акцентный цвет — только для главных действий. Если акцентом покрашено всё, акцента нет.' },
        { h: 'Главное', p: 'Прищурься и посмотри на экран: видно ли главное за секунду?\nОдин шрифт, 2–3 размера, отступы по шкале, связанное рядом, один акцент.\nЭти правила — 80% «дорогого» вида без единого украшательства.' }
      ],
      quiz: [
        { q: 'Заголовок блока должен быть…', a: ['Ближе к своему тексту, чем к предыдущему блоку', 'Ровно посередине между блоками', 'Ближе к предыдущему блоку — так компактнее'], c: 0, why: 'Правило близости: заголовок принадлежит своему тексту, и отступы должны это показывать. Равные отступы разваливают структуру.' },
        { q: 'На экране всё кажется одинаково важным. Что делать?', a: ['Добавить второй акцентный цвет', 'Выбрать главное и усилить его размером/насыщенностью, остальное приглушить', 'Увеличить весь текст'], c: 1, why: 'Иерархия строится контрастом «главное громко — остальное тихо». Добавлять громкости всем — сделать только хуже.' }
      ] },

    'heuristics': { title: '10 эвристик Нильсена', mins: 5,
      cards: [
        { h: 'Что это', p: 'Эвристики Нильсена — 10 проверенных правил хорошего интерфейса, сформулированные в Nielsen Norman Group. Это общий язык индустрии: на них ссылаются в отчётах и на собеседованиях.\nВот они группами, по-человечески.' },
        { h: 'Показывай и говори понятно', p: '1. Видимость статуса: система всегда показывает, что происходит — загрузку, сохранение, отправку.\n2. Язык пользователя: слова как в жизни, а не «инициировать транзакцию».\n3. Узнаваемость вместо припоминания: варианты видны, человеку не нужно вспоминать команды и коды.' },
        { h: 'Давай контроль', p: '4. Свобода: из любого места можно выйти, отменить, вернуться.\n5. Предотвращение ошибок: опасное действие переспрашивается, форма подсказывает формат до отправки.\n6. Помощь при ошибках: сообщение говорит, что случилось и как исправить — «файл больше 5 МБ, сожмите его», а не «Ошибка 500».' },
        { h: 'Не заставляй думать', p: '7. Последовательность: одинаковые вещи выглядят и работают одинаково на всех экранах.\n8. Минимализм: ничего лишнего, каждый элемент зарабатывает своё место.\n9. Гибкость: новичку просто, опытному быстро (поиск, ярлыки, недавние).\n10. Справка: если без инструкции никак — она короткая и под рукой.' },
        { h: 'Как применять', p: 'Эвристики — чек-лист для разбора любого экрана: пройди по десятке и спроси «а тут это соблюдено?».\nВ отчётах ссылка на эвристику усиливает находку: «нарушена видимость статуса — после оплаты нет подтверждения, люди жмут дважды».' }
      ],
      quiz: [
        { q: 'После нажатия «Оплатить» экран замирает на 5 секунд без изменений. Какая эвристика нарушена?', a: ['Минимализм', 'Видимость статуса системы', 'Гибкость использования'], c: 1, why: 'Человек не знает, идёт ли оплата — и жмёт ещё раз. Система обязана показывать, что происходит: спиннер, «платёж обрабатывается».' },
        { q: '«Ошибка 500. Обратитесь к администратору» — что не так?', a: ['Всё нормально, код ошибки полезен', 'Сообщение не говорит, что случилось и что делать дальше', 'Слишком вежливо'], c: 1, why: 'Эвристика помощи при ошибках: сообщение должно быть на языке человека и предлагать выход. Код 500 ничего не говорит пользователю.' }
      ] },

    'krug': { title: '«Don\'t Make Me Think» за 10 минут', mins: 4,
      cards: [
        { h: 'Главная мысль книги', p: 'Стив Круг: хороший интерфейс не заставляет думать. Каждый экран должен быть самоочевидным — взглянул и понял, что это и куда жать.\nКаждый «а что это значит?» — маленькая трещина в доверии. Трещины складываются, человек уходит.' },
        { h: 'Люди не читают', p: 'Мы не читаем страницы — мы их сканируем в поисках зацепок, жмём первое похожее на правду и продираемся дальше.\nВывод: пиши заголовки как указатели, режь текст пополам (а потом ещё раз пополам), делай кликабельное очевидно кликабельным.' },
        { h: 'Соглашения — твои друзья', p: 'Логотип слева сверху ведёт на главную, корзина — иконка корзины, поиск — строка с лупой. Люди приходят с привычками из тысяч других сайтов.\nИзобретать «оригинальную» навигацию — заставлять думать. Оригинальничай в контенте, а не в базовых механиках.' },
        { h: 'Главное', p: 'Самоочевидность важнее красоты. Убирай шум, называй прямо, следуй соглашениям.\nИ любимый тест Круга: покажи экран человеку на 3 секунды и спроси, что это за страница и что тут главное. Не ответил — экран не работает.' }
      ],
      quiz: [
        { q: 'Дизайнер придумал «свежую» навигацию: меню открывается свайпом от правого нижнего угла. По Кругу это…', a: ['Отлично: запоминающийся, уникальный опыт', 'Плохо: нарушено соглашение, люди будут думать вместо того, чтобы пользоваться', 'Нормально, если сделать обучающую подсказку на 5 экранов'], c: 1, why: 'Базовые механики должны быть привычными. Всё, что заставляет разбираться, тратит доверие. Туториал на 5 экранов — симптом, а не лечение.' }
      ] },

    'redesign': { title: 'Редизайн с обоснованием', mins: 4,
      cards: [
        { h: 'Редизайн — не «перекрасить»', p: 'Слабый редизайн: «сделал красивее». Сильный: «нашёл проблемы — вот решения».\nПоэтому редизайн начинается не в Figma, а с находок: свои тесты, эвристики Нильсена, правила визуала. Каждая правка должна отвечать на найденную проблему.' },
        { h: 'Формула «почему так»', p: 'К каждому изменению — одна строка: [что изменил] потому что [проблема/принцип].\n«Поднял кнопку записи выше сгиба — 2 из 3 респондентов её не находили». «Убрал 4 из 6 цветов — акцент перестал теряться».\nЕсли строка не пишется — правка вкусовая, кандидат на выброс.' },
        { h: 'До/после', p: 'Показывай редизайн парой «было → стало» с подписью, что именно починено.\nЭто самый убедительный формат: он показывает мышление, а не «мне нравится синенький». Именно такие пары потом лягут в кейс.' },
        { h: 'Главное', p: 'Порядок: находки → правки → обоснование в одну строку → пара «до/после».\nПокажи результат живому человеку и запиши реакцию — это мини-тест твоего редизайна.' }
      ],
      quiz: [
        { q: 'Какое обоснование правки — сильное?', a: ['«Так современнее и воздушнее»', '«Перенёс цену к кнопке: на тестах люди спрашивали, сколько это стоит, уже на форме оплаты»', '«Такой паттерн у топовых приложений»'], c: 1, why: 'Сильное обоснование опирается на наблюдение или принцип, а не на вкус. «У топов так» — слабый аргумент без понимания, почему у них так.' }
      ] },

    /* ---------- Кейсы ---------- */

    'pick-product': { title: 'Как выбрать продукт для кейса', mins: 3,
      cards: [
        { h: 'Критерий №1 — доступ к людям', p: 'Кейс делается не про интерфейс, а про людей. Поэтому выбирай продукт, где ты можешь достать 3–5 реальных пользователей: знакомый бизнес, локальная кофейня, секция, салон, доставка.\nКрасивый, но недосягаемый сервис — плохой выбор.' },
        { h: 'Маленькое лучше громкого', p: '«Редизайн Авито» без доступа к данным и пользователям — фантазия, и рекрутеры это видят сразу.\nСайт записи в автосервис твоего знакомого с 4 живыми интервью — настоящее исследование. Маленькое и настоящее бьёт большое и выдуманное.' },
        { h: 'Одна фраза цели', p: 'До старта сформулируй одну фразу: «Хочу выяснить, почему [кто] не может/бросает [что]».\n«Почему клиенты звонят, вместо того чтобы записаться на сайте». Эта фраза — компас: она задаёт вопросы интервью и не даёт расползтись.' },
        { h: 'Главное', p: 'Выбирай по доступу к владельцу и пользователям, а не по красоте бренда.\nМаленький настоящий продукт > большой выдуманный.\nОдна фраза «что хочу выяснить» — до первого интервью.' }
      ],
      quiz: [
        { q: 'Что выбрать для первого кейса?', a: ['Концепт редизайна Spotify — все знают продукт', 'Сайт студии растяжки, куда ходит твоя знакомая: можно поговорить с владельцем и клиентами', 'Придуманное приложение для несуществующего стартапа'], c: 1, why: 'Решает доступ к живым людям: интервью и тесты сделают кейс настоящим исследованием, а не картинками. Концепты без данных рекрутеры не ценят.' }
      ] },

    'prototype': { title: 'От находок к прототипу', mins: 4,
      cards: [
        { h: 'Не рисуй всё приложение', p: 'Прототип — не весь продукт, а тропинка через 2–3 главные проблемы из твоих находок.\nВыбери один сценарий («найти цену и записаться») и собери только экраны этого пути: 3–6 штук. Остальное не нужно.' },
        { h: 'Сначала поток, потом пиксели', p: 'До экранов набросай user flow — цепочку шагов: главная → услуга → цена → запись → подтверждение.\nПроверь цепочку на логику: нигде не обрывается? Каждый шаг понятно ведёт к следующему? Потом уже открывай наработанные паттерны и собирай экраны.' },
        { h: 'Кликабельность за 10 минут', p: 'В режиме Prototype в Figma протяни стрелки от кнопок к экранам — получится «живой» прототип: по нему можно пройти пальцем на телефоне.\nЭто и есть то, что ты дашь людям на тесте. Совет: добавь переход «назад», люди всегда жмут назад.' },
        { h: 'Главное', p: 'Находки → выбор 2–3 проблем → user flow → экраны пути → клики.\nПрототип должен позволять решить задачу теста от начала до конца — и не должен содержать ничего сверх этого.' }
      ],
      quiz: [
        { q: 'Сколько экранов нужно в первом прототипе?', a: ['Все экраны будущего продукта, штук 30', '3–6 экранов одного главного сценария', 'Один экран, но идеальный'], c: 1, why: 'Прототип проверяет конкретный путь к цели. Полный продукт рисовать рано (и незачем), один экран не проверит сценарий.' }
      ] },

    'iterate': { title: 'Тест прототипа и итерация', mins: 3,
      cards: [
        { h: 'Прототип — это гипотеза', p: 'Ты собрал экраны, опираясь на находки. Но пока по ним не прошёл живой человек — это гипотеза, а не решение.\nТест прототипа проводится как обычный юзабилити-тест: задача, молчание, точные слова. Люди 2–3, больше не надо.' },
        { h: 'Что считать провалом', p: 'Ничего. Если человек застрял в твоём прототипе — это не провал, это находка, полученная ДО того, как продукт построили. Ровно ради этого прототипы и существуют.\nЗаписывай места застревания так же, как на тестах чужих сайтов.' },
        { h: 'Итерация', p: 'Итерация = правки по результатам теста: переставил, переназвал, упростил.\nВ кейсе это самая ценная часть: «в первой версии люди не находили цену → перенёс цену на карточку → во втором тесте нашли все». Это показывает процесс, а не картинку.' },
        { h: 'Главное', p: 'Прототип → тест на 2–3 людях → правки → (в идеале) ещё один быстрый тест.\nСохрани скриншот версии ДО правок — пара «до/после итерации» станет золотым слайдом кейса.' }
      ],
      quiz: [
        { q: 'На тесте прототипа человек не нашёл кнопку записи. Это…', a: ['Провал прототипа, лучше это скрыть', 'Ценная находка: чиним до того, как продукт построен, и показываем итерацию в кейсе', 'Повод сменить респондента'], c: 1, why: 'Прототип для того и существует, чтобы ломаться дёшево. Найденная проблема + правка + повторный тест = сильнейший фрагмент кейса.' }
      ] },

    'case': { title: 'Структура сильного кейса', mins: 5,
      cards: [
        { h: 'Кейс — это история решения', p: 'Кейс читают 2–3 минуты. За это время рекрутер должен понять: была проблема → ты исследовал → принял решения → получил результат.\nКартинки без истории — не кейс, а галерея. История без картинок — отчёт. Нужно и то и то.' },
        { h: 'Скелет кейса', p: '1. Контекст: продукт, твоя роль, сколько времени заняло.\n2. Проблема: одной фразой, лучше с цифрой или цитатой.\n3. Исследование: что делал, сколько людей, 3–4 главные находки с цитатами.\n4. Решение: экраны с пояснением «почему так».\n5. Итерация: что не сработало и как починил.\n6. Результат и выводы.' },
        { h: 'Цитаты и «до/после»', p: 'Два элемента делают кейс живым:\n— точные цитаты респондентов («я думал, это реклама, и не нажимал»);\n— пары «до/после» с подписью, что починено.\nОни доказывают, что решения выросли из данных, а не из вкуса.' },
        { h: 'Типичные ошибки', p: '— Стена текста: режь, ставь подзаголовки, человек сканирует.\n— Только финальные экраны без процесса: неотличимо от копирования.\n— «Мы» без твоей роли: пиши, что делал именно ты.\n— Вывод «всем понравилось»: лучше честное «что бы я сделал иначе».' },
        { h: 'Главное', p: 'Проблема → исследование → решение → итерация → результат.\nЦитаты + «до/после» + понятная твоя роль.\nОпубликуй и проверь ссылку в инкогнито: закрытый кейс = кейса нет.' }
      ],
      quiz: [
        { q: 'Что важнее всего показать в кейсе?', a: ['Максимум красивых финальных экранов', 'Ход мысли: как находки привели к решениям и что изменила итерация', 'Список инструментов, которыми владеешь'], c: 1, why: 'Джуна берут за мышление, а не за пиксели: процесс «данные → решение → проверка» — то, что отличает дизайнера от рисовальщика.' },
        { q: 'Кейс готов. Что проверить перед отправкой отклика?', a: ['Что ссылка открывается в режиме инкогнито без доступа по запросу', 'Что в кейсе больше 20 экранов', 'Что нигде не видно ошибок первой версии'], c: 0, why: 'Закрытая ссылка убивает отклик молча. А ошибки первой версии как раз показывай — итерация украшает кейс, а не позорит.' }
      ] },

    /* ---------- Работа ---------- */

    'portfolio': { title: 'Портфолио без воды', mins: 4,
      cards: [
        { h: 'Что такое портфолио джуна', p: 'Это 2 сильных кейса + короткое «о себе». Всё.\nNotion или Behance — нормальные площадки, собственный сайт не обязателен. Рекрутер тратит на первый просмотр 1–2 минуты: структура важнее платформы.' },
        { h: 'Меньше — сильнее', p: 'Портфолио оценивают по слабейшей работе. Два сильных кейса лучше пяти сырых: каждый слабый тянет впечатление вниз.\nКопии экранов из обучения, «концепты за вечер», недоделки — убрать. Жалко, но убрать.' },
        { h: 'Только правда', p: 'Никаких выдуманных клиентов и «работал в команде X», если не работал. Проверяется одним вопросом на собеседовании, а доверие не возвращается.\n«Учебный проект для реального салона, неоплачиваемый» — честно и звучит нормально. Настоящие интервью с людьми поднимают такой проект до рабочего уровня.' },
        { h: 'Главное', p: 'Структура: имя и роль → 2 кейса → контакты. Первым — сильнейший кейс.\nПроверь с телефона и с чужого устройства: открывается ли, читается ли, не просит ли доступ.' }
      ],
      quiz: [
        { q: 'У тебя 2 сильных кейса и 3 сырых наброска. Что показывать?', a: ['Все 5 — пусть видят объём работы', 'Только 2 сильных', 'Сырые доработать фотошопом за вечер и показать все'], c: 1, why: 'Портфолио судят по худшей работе. Сырые кейсы не добавляют объёма — они отнимают доверие у сильных.' }
      ] },

    'resume': { title: 'Резюме и LinkedIn джуна', mins: 4,
      cards: [
        { h: 'Одна страница, одна роль', p: 'Резюме джуна — строго 1 страница под конкретную роль: «Junior Product/UX Designer».\nСверху: имя, роль, город/удалёнка, контакты и ссылка на портфолио. Ссылка на портфолио — самое важное поле всего резюме, проверь её трижды.' },
        { h: 'Кейсы вместо «обязанностей»', p: 'В блоке опыта у тебя вместо мест работы — проекты: те же 2 кейса, по 2–3 строки: что за продукт, что сделал (исследование, прототип, итерации), что получилось.\nПрошлый не-дизайнерский опыт не прячь: продажи, поддержка, преподавание — это работа с людьми, для UX это плюс.' },
        { h: 'Навыки без «воды»', p: 'Пиши конкретно: Figma (auto-layout, компоненты, прототипы), юзабилити-тесты, глубинные интервью, отчёты.\nНе пиши «стрессоустойчивость», «креативность» и «знание Photoshop на 7/10» — это шум, рекрутеры его пролистывают.' },
        { h: 'Главное', p: 'LinkedIn заполни по тому же шаблону: та же роль, тот же список проектов, портфолио в шапку профиля, открой «Open to work».\nЗарплатную вилку реши заранее, до откликов: посмотри вилки в 10 похожих вакансиях и выбери свою — на интервью этот вопрос будет.' }
      ],
      quiz: [
        { q: 'Что обязательно должно работать в резюме идеально?', a: ['Красивый шаблон с инфографикой навыков', 'Ссылка на портфолио', 'Раздел о хобби'], c: 1, why: 'Резюме джуна-дизайнера — это обёртка вокруг ссылки на кейсы. Битая или закрытая ссылка обнуляет отклик, каким бы красивым ни был шаблон.' }
      ] },

    'apply': { title: 'Система откликов', mins: 4,
      cards: [
        { h: 'Это воронка, а не лотерея', p: 'Поиск первой работы — числовая воронка: примерно из 30–50 откликов получается несколько ответов и 1–3 собеседования. Это нормально, отказы — не сигнал «я плохой», а статистика воронки.\nПоэтому работает система: 10–15 откликов в неделю, 2–3 в день, без пауз «подожду ответа».' },
        { h: 'Куда и на что', p: 'Площадки: LinkedIn, hh.ru, career.habr.com, Indeed. Сохрани фильтры: junior UX/UI, product designer, стажировки.\nОткликайся и туда, где просят «1–2 года опыта»: это часто «хотелось бы», а не барьер. Стажировки не игнорируй — это самый короткий путь к первому офферу.' },
        { h: 'Короткая записка', p: 'К отклику — 3–4 предложения, не «простыня»: кто ты, почему именно эта компания (одна конкретная причина), ссылка на релевантный кейс.\n«Сделал редизайн записи для локального сервиса, у вас похожая задача в продукте — вот кейс». Персонализация одной строки уже выделяет из массы.' },
        { h: 'Главное', p: 'Веди табличку: компания, дата, статус, ответ. Она превращает хаос в процесс и показывает прогресс к гейту «30 откликов или 3 собеседования».\nОтказ или тишина — норма воронки. Твоя метрика — количество качественных откликов в неделю.' }
      ],
      quiz: [
        { q: 'Неделя откликов — тишина. Что делать?', a: ['Остановиться и переделать портфолио с нуля', 'Продолжать по системе: 2–3 отклика в день; тишина первые недели — норма воронки', 'Сделать вывод, что профессия не подходит'], c: 1, why: 'Воронка работает на дистанции в десятки откликов. Паника после первой недели ломает систему. Пересматривать материалы стоит после 20–30 откликов без ответов.' }
      ] },

    'pd-interview': { title: 'Собеседование дизайнера', mins: 4,
      cards: [
        { h: 'Что будут спрашивать', p: 'Ядро интервью джуна — рассказ о кейсе: «расскажите о проекте», «почему приняли это решение», «что было самым сложным», «что бы сделали иначе».\nЕщё встречаются: «почему UX», «как проверите, что дизайн хороший», разбор чужого экрана вслух и маленькое тестовое.' },
        { h: 'Рассказ о кейсе за 3 минуты', p: 'Отрепетируй вслух структуру: проблема (30 сек) → исследование и находки (1 мин) → решение и почему так (1 мин) → итерация и результат (30 сек).\nИменно вслух и с таймером: «в голове» все рассказывают блестяще, вслух в первый раз — никто.' },
        { h: 'Как отвечать про решения', p: 'Формула ответа на «почему так?»: наблюдение → решение → проверка. «Люди не находили цену (2 из 3 на тесте) → вынес её на карточку → во втором тесте нашли все».\nЧестное «этого я не проверял, проверил бы так-то» звучит сильнее, чем выдумывание на ходу.' },
        { h: 'Главное', p: 'Подготовь: 3-минутный рассказ о кейсе, ответ на «почему UX», 2–3 вопроса о компании (про команду, процессы, с чем предстоит работать).\nВопросы от тебя — тоже часть оценки: они показывают, что ты выбираешь, а не умоляешь.' }
      ],
      quiz: [
        { q: 'На собесе спросили: «Почему кнопка здесь?» Лучший ответ:', a: ['«Мне показалось, так гармоничнее»', '«На тесте 2 из 3 не находили её внизу — перенёс наверх и перепроверил»', '«Так делает Airbnb»'], c: 1, why: 'Формула наблюдение → решение → проверка показывает дизайнерское мышление. Вкус и «как у больших» — ответы, которые джуна топят.' }
      ] },

    'mentor': { title: 'Как выжать максимум из ментора', mins: 3,
      cards: [
        { h: 'Зачем ментор', p: 'Ментор за час находит в портфолио и рассказе то, что ты сам не увидишь за месяц: слепые зоны, слабые формулировки, дыры в кейсе.\nADPList — площадка, где практикующие дизайнеры менторят бесплатно. Фильтруй по UX и смотри профиль: нужен тот, кто нанимает или собеседует джунов.' },
        { h: 'Приходи с конкретикой', p: 'Худший запрос: «посмотрите моё портфолио, что скажете?». Лучший: «Вот кейс, вот 3 вопроса: понятна ли проблема? где рассказ провисает? что выкинуть?».\nНа мок-собеседовании попроси: «прогоните меня как реального кандидата и скажите честно, где я плыву».' },
        { h: 'Главное', p: 'Правило одной сессии: из каждой встречи — список правок, и правки внесены ДО следующей сессии.\nМентор, который видит внедрённый фидбек, начинает вкладываться сильнее — иногда это заканчивается рекомендацией на вакансию.' }
      ],
      quiz: [
        { q: 'Как правильно попросить ментора о сессии?', a: ['«Посмотрите портфолио, скажите, что думаете»', '«Вот кейс и 3 конкретных вопроса к нему»', '«Расскажите, как войти в UX»'], c: 1, why: 'Конкретные вопросы дают конкретные ответы и уважают время ментора. Расплывчатый запрос — расплывчатая польза.' }
      ] },

    'certs': { title: 'Что дают сертификаты', mins: 3,
      cards: [
        { h: 'Честно про сертификаты', p: 'Сертификат не устраивает на работу — устраивают кейсы. Рекрутеры смотрят портфолио, а строчку про курс замечают в последнюю очередь.\nПоэтому в этом роадмапе ни один гейт не завязан на курсы: они фон, а не путь.' },
        { h: 'Когда курс полезен', p: 'Google UX Design на Coursera даёт систему: словарь, процесс, порядок этапов — полезно, чтобы разложить по полочкам то, что ты уже делаешь руками.\nПравильный режим: проходить фоном, параллельно с практикой, без давления и дедлайнов. Сертификат получился — добавь строчку в резюме, лишним не будет.' },
        { h: 'Главное', p: 'Приоритет всегда: живой тест > курс, кейс > сертификат.\nЕсли выбор «пройти модуль курса или провести интервью» — всегда интервью. Курс подождёт, практика двигает к офферу.' }
      ],
      quiz: [
        { q: 'Есть 3 свободных часа. Куда их деть с максимальной пользой?', a: ['Пройти 3 модуля курса, чтобы скорее получить сертификат', 'Провести юзабилити-тест и дописать находки в кейс', 'Посмотреть подборку «10 трендов дизайна»'], c: 1, why: 'К офферу двигают кейсы с живым ресёрчем. Курсы — полезный фон, но фон не должен вытеснять практику.' }
      ] },

  /* ---------- state ---------- */

  function blankState() {
    return {
      steps: {}, theory: {}, videos: {},
      games: { rounds: 0, sprintBest: 0 },

  function loadState() {
    try {
      var v = JSON.parse(localStorage.getItem(STORE_KEY));
      if (v && typeof v === 'object' && !Array.isArray(v)) {
        var out = blankState();
        if (v.steps && typeof v.steps === 'object' && !Array.isArray(v.steps)) {
          Object.keys(v.steps).forEach(function (k) { if (v.steps[k] && /^s\d+-t\d+-p\d+$/.test(k)) out.steps[k] = true; });
        }
        if (v.theory && typeof v.theory === 'object' && !Array.isArray(v.theory)) {
          Object.keys(v.theory).forEach(function (k) { if (v.theory[k] && LESSONS[k]) out.theory[k] = true; });
        }
        if (v.videos && typeof v.videos === 'object' && !Array.isArray(v.videos)) {
          Object.keys(v.videos).forEach(function (k) { if (v.videos[k] && VIDEOS[k]) out.videos[k] = true; });
        }
        if (v.games && typeof v.games === 'object' && !Array.isArray(v.games)) {
          var rr = Number(v.games.rounds), sb = Number(v.games.sprintBest);
          if (isFinite(rr) && rr > 0) out.games.rounds = Math.floor(rr);
          if (isFinite(sb) && sb > 0) out.games.sprintBest = Math.min(10, Math.floor(sb));
        }
        if (v.streak && typeof v.streak === 'object' && !Array.isArray(v.streak)) {
          out.streak.count = typeof v.streak.count === 'number' && isFinite(v.streak.count) ? Math.max(0, Math.floor(v.streak.count)) : 0;
          out.streak.last = typeof v.streak.last === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v.streak.last) ? v.streak.last : '';
        }
        if (v.activity && typeof v.activity === 'object' && !Array.isArray(v.activity)) {
          Object.keys(v.activity).forEach(function (k) {
            var n = Number(v.activity[k]);
            if (isFinite(n) && n > 0) out.activity[k] = n;
          });
        }
        if (typeof v.focusTask === 'string') out.focusTask = v.focusTask;
        if (v.reminder && typeof v.reminder === 'object' && !Array.isArray(v.reminder)) {
          out.reminder.on = v.reminder.on === true;
          if (typeof v.reminder.time === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(v.reminder.time)) out.reminder.time = v.reminder.time;
          if (typeof v.reminder.fired === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v.reminder.fired)) out.reminder.fired = v.reminder.fired;
        }
        return out;
      }
    } catch (e) {}

  }

  /* ---------- derived helpers ---------- */

  function taskId(si, ti) { return 's' + si + '-t' + ti; }
  function stepId(si, ti, pi) { return taskId(si, ti) + '-p' + pi; }

    return task.seg.map(function (p) { return typeof p === 'string' ? p : hostOf(p.url); }).join('');
  }

  /* следующая незакрытая задача в пределах ЭТОГО же этапа;

  function nextIncompleteAfter(id) {
    var cur = findTask(id);
    if (!cur) return null;
    var si = cur[0];

    STAGES[si].tasks.forEach(function (_, ti) {
      if (!taskDone(si, ti)) inStage.push([si, ti]);

    if (inStage.length >= 2) {

      for (var i = 0; i < inStage.length; i++) if (taskId(inStage[i][0], inStage[i][1]) === id) { idx = i; break; }
      return inStage[(idx + 1) % inStage.length];
    }
    for (var off = 1; off <= STAGES.length; off++) {
      var sj = (si + off) % STAGES.length;
      for (var tj = 0; tj < STAGES[sj].tasks.length; tj++) {

        tasks++;
        steps += task.steps.length;
        task.steps.forEach(function (_, pi) { if (state.steps[stepId(si, ti, pi)]) stepsDone++; });
        if (taskDone(si, ti)) { tasksDone++; if (task.gate) gatesDone++; }

  function bumpStreak() {
    var today = todayKey();
    if (state.streak.last < today) {
      state.streak.count = (state.streak.last === dateKeyOffset(-1)) ? state.streak.count + 1 : 1;
      state.streak.last = today;

  function ringSVG(size, stroke, pct, cls) {

    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'ring' + (cls ? ' ' + cls : ''));
    svg.setAttribute('width', size); svg.setAttribute('height', size);
    svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
    svg.setAttribute('aria-hidden', 'true');
    var track = document.createElementNS(svgNS, 'circle');
    track.setAttribute('class', 'track');

    track.setAttribute('r', r); track.setAttribute('stroke-width', stroke);
    var val = document.createElementNS(svgNS, 'circle');

  function fireReminderNotification(title, body) {
    /* на части мобильных браузеров конструктор Notification запрещён — бросит исключение */
    var n = new Notification(title, { body: body, tag: 'ux-roadmap-daily' });
    n.onclick = function () { try { window.focus(); } catch (e) {} this.close(); };
  }
  function checkReminder() {
    if (!state.reminder.on) return;
    if (!notifySupported() || Notification.permission !== 'granted') return;
    var today = todayKey();
    if (state.reminder.fired >= today) return; /* уже напоминали (>= — защита от перевода часов) */
    if (state.activity[today]) return;         /* сегодня уже занимался — не дёргаем */
    var now = new Date();
    var hm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    if (hm < state.reminder.time) return;
    state.reminder.fired = today;
    saveState();
    try {
      fireReminderNotification('UX: от нуля до найма', streakAtRisk()
        ? 'Стрик 🔥 ' + currentStreak() + ' сгорит сегодня. Один шаг — и он продлится.'
        : 'Один маленький шаг сегодня. Карточка уже ждёт.');
    } catch (e) {}
  }
  function reminderICS() {
    var hmParts = state.reminder.time.split(':');
    var now = new Date();
    var start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), Number(hmParts[0]), Number(hmParts[1]));
    if (start <= now) start.setDate(start.getDate() + 1);
    function d2(n) { return String(n).padStart(2, '0'); }
    var dt = start.getFullYear() + d2(start.getMonth() + 1) + d2(start.getDate()) + 'T' + d2(start.getHours()) + d2(start.getMinutes()) + '00';
    var stamp = now.getUTCFullYear() + d2(now.getUTCMonth() + 1) + d2(now.getUTCDate()) + 'T' + d2(now.getUTCHours()) + d2(now.getUTCMinutes()) + '00Z';
    return [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//ux-roadmap//RU',
      'BEGIN:VEVENT',
      'UID:ux-roadmap-daily-' + dt + '@ux-roadmap',
      'DTSTAMP:' + stamp,
      'DTSTART:' + dt,
      'DURATION:PT15M',
      'RRULE:FREQ=DAILY',
      'SUMMARY:UX-роадмап: один шаг сегодня 🔥',
      'DESCRIPTION:Открой сайт и сделай один шаг или урок — стрик продлится.\\n' + location.href,
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'TRIGGER:PT0S', 'DESCRIPTION:UX-роадмап: один шаг сегодня', 'END:VALARM',
      'END:VEVENT', 'END:VCALENDAR'
    ].join('\r\n');
  }
  function downloadICS() {
    var blob = new Blob([reminderICS()], { type: 'text/calendar;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'ux-roadmap-reminder.ics';
    document.body.appendChild(a);
    a.click();
    a.remove();

  }
  function openOverlay(node) {
    if (pendingAdvance) { clearTimeout(pendingAdvance); pendingAdvance = null; justCompleted = ''; }

  /* ---------- урок ---------- */

  function openLesson(id) {
    if (!LESSONS[id]) return;

  function renderLesson() {
    var L = LESSONS[lessonId];
    if (!L) return;
    var nCards = L.cards.length, nQuiz = L.quiz.length;
    var total = nCards + nQuiz + 1;
    document.getElementById('lessonBar').style.width = Math.round((lessonPos + 1) / total * 100) + '%';
    var count = document.getElementById('lessonCount');
    lessonBody.textContent = '';
    lessonScroll.scrollTop = 0;

    if (lessonPos < nCards) {
      /* карточка теории */
      count.textContent = (lessonPos + 1) + ' / ' + total;
      lessonBody.appendChild(el('div', 'l-eyebrow', '📖 ' + L.title));
      var c = L.cards[lessonPos];
      var h = el('h2', 'l-h', c.h);
      h.id = 'lessonTitle';
      lessonBody.appendChild(h);
      c.p.split('\n').forEach(function (par) {
        lessonBody.appendChild(el('p', 'l-p', par));
      });
      var next = el('button', 'l-next', lessonPos === nCards - 1 ? (nQuiz ? 'Проверить себя →' : 'Дальше') : 'Дальше');
      next.type = 'button';
      next.dataset.lessonNext = '1';
      lessonBody.appendChild(next);
      next.focus();
    } else if (lessonPos < nCards + nQuiz) {
      /* вопрос */
      var qi = lessonPos - nCards;
      var q = L.quiz[qi];
      count.textContent = (lessonPos + 1) + ' / ' + total;
      lessonBody.appendChild(el('div', 'l-eyebrow', 'Проверь себя · вопрос ' + (qi + 1) + ' из ' + nQuiz));
      var qh = el('h2', 'quiz-q', q.q);
      qh.id = 'lessonTitle';
      lessonBody.appendChild(qh);
      var opts = el('ul', 'quiz-opts');
      q.a.forEach(function (optText, oi) {
        var li = el('li');
        var b = el('button', 'quiz-opt', optText);
        b.type = 'button';
        b.dataset.quizOpt = oi;
        li.appendChild(b);
        opts.appendChild(li);
      });
      lessonBody.appendChild(opts);
    } else {
      /* финал */
      count.textContent = '🎉';
      var first = !state.theory[lessonId];
      if (first) {
        state.theory[lessonId] = true;
        bumpStreak();
        saveState();
        renderTopbar();
      }
      var fin = el('div', 'l-final');
      fin.appendChild(el('div', 'big', '✅'));
      var fh = el('h2', '', 'Урок пройден');
      fh.id = 'lessonTitle';
      fin.appendChild(fh);
      fin.appendChild(el('p', '', '«' + L.title + '» — в копилке. Теория без практики выветривается: дальше — руками.'));
      var next = el('button', 'l-next', 'К практике →');
      next.type = 'button';
      next.dataset.lessonFinish = '1';
      fin.appendChild(next);
      lessonBody.appendChild(fin);
      next.focus();
    }
  }

  lessonBody.addEventListener('click', function (e) {
    var next = e.target.closest('[data-lesson-next]');
    if (next) {
      lessonPos++;

      return;
    }
    var fin = e.target.closest('[data-lesson-finish]');

      requestCloseOverlay();
      return;
    }
    var opt = e.target.closest('[data-quiz-opt]');

      lessonAnswered = true;
      var L = LESSONS[lessonId];
      var q = L.quiz[lessonPos - L.cards.length];
      var chosen = Number(opt.dataset.quizOpt);
      var buttons = lessonBody.querySelectorAll('.quiz-opt');
      buttons.forEach(function (b, bi) {
        b.disabled = true;
        if (bi === q.c) b.classList.add('right');
        else if (bi === chosen) b.classList.add('wrong');
      });
      var why = el('div', 'quiz-why');
      why.appendChild(el('b', '', chosen === q.c ? 'Верно. ' : 'Не совсем. '));
      why.appendChild(document.createTextNode(q.why));
      lessonBody.appendChild(why);
      var next = el('button', 'l-next', 'Дальше');
      next.type = 'button';
      next.dataset.lessonNext = '1';
      lessonBody.appendChild(next);
      next.focus();
    }
  });

  document.getElementById('lessonClose').addEventListener('click', requestCloseOverlay);
  document.getElementById('playerClose').addEventListener('click', requestCloseOverlay);
  document.getElementById('gameClose').addEventListener('click', requestCloseOverlay);
  window.addEventListener('popstate', function () {
    if (topOverlay()) { overlayPushed = false; closeTopOverlay(); }
  });

  /* ---------- видео-плеер ---------- */

  var playerId = '';

  function openPlayer(id) {
    if (!VIDEOS[id]) return;
    playerId = id;

    document.getElementById('playerClose').focus();

    var box = el('div', 'video-box');

  playerBody.addEventListener('click', function (e) {
    if (e.target.closest('#playerDoneBtn') && playerId && !state.videos[playerId]) {
      state.videos[playerId] = true;
      bumpStreak();
      saveState();
      renderTopbar();
      renderPlayer();
      document.getElementById('playerClose').focus(); /* кнопка стала disabled — фокусу нужно новое место */
